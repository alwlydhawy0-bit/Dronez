[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronez"
version = "0.0.0"
description = "Tactical Drone Swarm & Recon MCP Server — reconnaissance-only, high-assurance"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Milestone 1 adds exactly one runtime dependency. Every addition widens the
# supply-chain surface (Zero-Trust Standard Sec.6.2), so each one is justified here:
#
#   pydantic  -- strict schema enforcement at the MCP boundary is mandated by
#                Zero-Trust Sec.3.1, and hand-rolling it for seven tool contracts would
#                trade a reviewed dependency for unreviewed validation code.
#
# `dronez.safety` and `dronez.airspace` remain stdlib-only so the safety envelope and
# the clearance logic stay fuzzable as pure functions with no import surface.
#
# The policy engine deliberately adds nothing: policy_engine.client speaks to the OPA
# sidecar over urllib rather than an HTTP library, keeping the authorization path's
# dependency count at zero.
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Command-signature verification. Optional so `dronez` and the schema layer stay
# importable without it -- when it is absent the ES256/RS256 verifiers are simply not
# in the registry, so a request naming them is rejected with an explicit error rather
# than passing unverified.
crypto = ["cryptography>=41"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx",
    "cryptography>=41",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dronez.airspace" = ["schemas/*.json"]
"policy_engine" = ["policies/*.rego", "policies/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # Starlette's TestClient warns that httpx is deprecated in favour of httpx2. This
    # is a third-party transition notice about a test-only dependency, not a signal
    # about this codebase. Scoped to that exact message so every other warning still
    # fails the build.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
# S101: pytest relies on assert. The narrowing asserts in schema.py are type
# refinements for mypy; the enforcing checks there are explicit raises, never asserts.
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unreachable = true
