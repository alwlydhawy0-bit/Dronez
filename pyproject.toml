[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronez"
version = "0.0.0"
description = "Tactical Drone Swarm & Recon MCP Server — reconnaissance-only, high-assurance"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Milestone 1 adds exactly one runtime dependency. Every addition widens the
# supply-chain surface (Zero-Trust Standard Sec.6.2), so each one is justified here:
#
#   pydantic  -- strict schema enforcement at the MCP boundary is mandated by
#                Zero-Trust Sec.3.1, and hand-rolling it for seven tool contracts would
#                trade a reviewed dependency for unreviewed validation code.
#
# `dronez.safety` and `dronez.airspace` remain stdlib-only so the safety envelope and
# the clearance logic stay fuzzable as pure functions with no import surface.
#
# The policy engine deliberately adds nothing: policy_engine.client speaks to the OPA
# sidecar over urllib rather than an HTTP library, keeping the authorization path's
# dependency count at zero.
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dronez.airspace" = ["schemas/*.json"]
"policy_engine" = ["policies/*.rego", "policies/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
# S101: pytest relies on assert. The narrowing asserts in schema.py are type
# refinements for mypy; the enforcing checks there are explicit raises, never asserts.
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unreachable = true
